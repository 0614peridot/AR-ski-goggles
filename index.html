<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ski 360 Environment</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b1a33; overflow: hidden; }
    canvas { display: block; touch-action: none; cursor: grab; }
    canvas:active { cursor: grabbing; }
    #hint {
      position: fixed; left: 50%; top: 16px; transform: translateX(-50%);
      padding: 8px 14px; border-radius: 999px;
      background: rgba(0, 0, 0, 0.35); color: #fff;
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      pointer-events: none; transition: opacity 0.6s;
    }
    #loading {
      position: fixed; inset: 0; display: grid; place-items: center;
      color: #fff; font: 14px -apple-system, sans-serif; background: #0b1a33;
      transition: opacity 0.4s;
    }
  </style>
  <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <div id="loading">Loading slope…</div>
  <div id="hint">Drag to look around · Scroll to zoom</div>
  <script type="module" src="./main.js"></script>
</body>
</html>
